<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Leads Tráfego - Óticas Ammo (Acumulativo)</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        /* Cores Padrões Óticas Ammo */
        :root {
            --ammo-black: #121212;
            --ammo-yellow: #FFD700;
            --ammo-dark-grey: #2C2C2C;
            --text-color: #FFFFFF;
            --danger-red: #ff4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--ammo-black);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--ammo-dark-grey);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            border: 1px solid var(--ammo-yellow);
        }

        h1, h2 {
            color: var(--ammo-yellow);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: var(--ammo-yellow);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            background-color: #444;
            border: 1px solid #666;
            color: white;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--ammo-yellow);
            background-color: #555;
        }

        .btn {
            background-color: var(--ammo-yellow);
            color: var(--ammo-black);
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-size: 18px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #e6c200;
            transform: scale(1.02);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            margin-top: 30px;
        }
        
        .btn-whatsapp:hover { background-color: #1ebc57; }

        .btn-clear {
            background-color: var(--danger-red);
            color: white;
            margin-top: 10px;
            font-size: 14px;
            padding: 10px;
        }
        
        .btn-clear:hover { background-color: #cc0000; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #555;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: var(--ammo-yellow);
            color: var(--ammo-black);
        }

        .hidden { display: none; }
        
        .section-box {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #555;
        }
        
        /* Estilo para barra de rolagem da tabela */
        .table-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <div class="container" id="setupScreen">
        <h1>Configuração Consultor Ammo</h1>
        
        <label>Nome do Colaborador:</label>
        <input type="text" id="colaboradorNome" placeholder="Seu nome">

        <label>Nome da Unidade/Ótica:</label>
        <input type="text" id="oticaNome" placeholder="Ex: Ammo Centro">

        <button class="btn" onclick="startSystem()">Acessar Sistema</button>
    </div>

    <div class="container hidden" id="mainScreen">
        <h1>Cadastro de Leads - Tráfego</h1>
        <div style="text-align: center; margin-bottom: 20px; color: #ccc;">
            <span id="displayColaborador"></span> | <span id="displayOtica"></span>
            <br>
            <a href="#" onclick="changeUser()" style="color: var(--ammo-yellow); font-size: 12px;">(Alterar Usuário)</a>
        </div>

        <form id="leadForm">
            <div class="section-box">
                <label for="nome">Nome do Cliente *</label>
                <input type="text" id="nome" required>

                <label for="telefone">Telefone (WhatsApp) *</label>
                <input type="tel" id="telefone" placeholder="(41) 99999-9999" required>

                <label for="canal">Canal de Captura *</label>
                <select id="canal" required>
                    <option value="">Selecione...</option>
                    <option value="Instagram">Instagram</option>
                    <option value="Facebook">Facebook</option>
                    <option value="Google Ads">Google Ads</option>
                    <option value="TikTok">TikTok</option>
                    <option value="Indicação">Indicação</option>
                </select>

                <label for="produto">Produto de Interesse *</label>
                <input type="text" id="produto" placeholder="Ex: Armação Solar, Grau, Lentes..." required>

                <label for="orcamento">Valor do Orçamento (R$) *</label>
                <input type="number" id="orcamento" step="0.01" required>

                <label for="objecao">Objeção do Cliente *</label>
                <input type="text" id="objecao" placeholder="Ex: Preço, Vai falar com marido, etc." required>

                <label for="comprou">O cliente comprou? *</label>
                <select id="comprou" onchange="toggleVenda()" required>
                    <option value="Não">Não</option>
                    <option value="Sim">Sim</option>
                </select>

                <div id="divValorVenda" class="hidden">
                    <label for="valorVenda">Valor da Venda (R$) *</label>
                    <input type="number" id="valorVenda" step="0.01">
                </div>
            </div>

            <button type="submit" class="btn">Cadastrar Lead</button>
        </form>

        <h2>Histórico de Leads (Acumulativo)</h2>
        <div class="table-container">
            <table id="tabelaLeads">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Canal</th>
                        <th>Interesse</th>
                        <th>Comprou?</th>
                        <th>Venda (R$)</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-whatsapp" onclick="gerarRelatorio()" style="flex: 2;">
                📊 Baixar Excel Geral e Enviar
            </button>
            <button class="btn btn-clear" onclick="limparHistorico()" style="flex: 1;">
                🗑️ Limpar Histórico
            </button>
        </div>
    </div>

    <script>
        // --- GERENCIAMENTO DE DADOS (LOCALSTORAGE) ---
        
        // Carrega leads salvos ou cria lista vazia
        let leads = JSON.parse(localStorage.getItem('leads_ammo_db')) || [];
        
        // Carrega configuração de usuário salva
        let savedConfig = JSON.parse(localStorage.getItem('leads_ammo_config')) || {};
        
        // Variáveis globais
        let colaborador = savedConfig.colaborador || "";
        let otica = savedConfig.otica || "";

        // Verifica se já tem usuário salvo ao abrir
        if (colaborador && otica) {
            document.getElementById('colaboradorNome').value = colaborador;
            document.getElementById('oticaNome').value = otica;
            // Opcional: pular direto para a tela principal
            // startSystem(); 
        }

        // --- FUNÇÕES DO SISTEMA ---

        function startSystem() {
            colaborador = document.getElementById('colaboradorNome').value;
            otica = document.getElementById('oticaNome').value;

            if (!colaborador || !otica) {
                alert("Por favor, preencha seu nome e a unidade.");
                return;
            }

            // Salva configuração no navegador
            localStorage.setItem('leads_ammo_config', JSON.stringify({ colaborador, otica }));

            document.getElementById('displayColaborador').innerText = "Colaborador: " + colaborador;
            document.getElementById('displayOtica').innerText = "Unidade: " + otica;
            
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');

            atualizarTabela(); // Carrega a tabela com dados antigos
        }

        function changeUser() {
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
        }

        function toggleVenda() {
            const comprou = document.getElementById('comprou').value;
            const divValor = document.getElementById('divValorVenda');
            const inputValor = document.getElementById('valorVenda');

            if (comprou === 'Sim') {
                divValor.classList.remove('hidden');
                inputValor.setAttribute('required', 'required');
            } else {
                divValor.classList.add('hidden');
                inputValor.removeAttribute('required');
                inputValor.value = "";
            }
        }

        // --- CADASTRO ---

        document.getElementById('leadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Pega data e hora atual
            const now = new Date();
            const dataFormatada = now.toLocaleDateString('pt-BR');
            const horaFormatada = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            const lead = {
                Data: dataFormatada,
                Hora: horaFormatada,
                Colaborador: colaborador,
                Unidade: otica,
                Nome: document.getElementById('nome').value,
                Telefone: document.getElementById('telefone').value,
                Canal: document.getElementById('canal').value,
                Produto: document.getElementById('produto').value,
                Orcamento: document.getElementById('orcamento').value,
                Objecao: document.getElementById('objecao').value,
                Comprou: document.getElementById('comprou').value,
                ValorVenda: document.getElementById('valorVenda').value || "0.00"
            };

            // Adiciona na lista
            leads.push(lead);

            // SALVA NO NAVEGADOR (PERSISTÊNCIA)
            localStorage.setItem('leads_ammo_db', JSON.stringify(leads));

            atualizarTabela();
            
            // Reseta formulário
            document.getElementById('leadForm').reset();
            document.getElementById('comprou').value = "Não";
            toggleVenda();
            
            alert("Lead salvo com sucesso!");
        });

        // --- TABELA ---

        function atualizarTabela() {
            const tbody = document.querySelector('#tabelaLeads tbody');
            tbody.innerHTML = "";

            // Inverte a ordem para mostrar os mais recentes primeiro na tabela (opcional)
            // Aqui mantivemos ordem de cadastro, mas vamos rolar a tabela para baixo se necessário
            leads.forEach(lead => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${lead.Data} <small>(${lead.Hora})</small></td>
                    <td>${lead.Nome}</td>
                    <td>${lead.Telefone}</td>
                    <td>${lead.Canal}</td>
                    <td>${lead.Produto}</td>
                    <td style="color: ${lead.Comprou === 'Sim' ? '#25D366' : '#fff'}">${lead.Comprou}</td>
                    <td>R$ ${lead.ValorVenda}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- RELATÓRIO E LIMPEZA ---

        function gerarRelatorio() {
            if (leads.length === 0) {
                alert("Nenhum lead no histórico.");
                return;
            }

            const ws = XLSX.utils.json_to_sheet(leads);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Leads Acumulados");

            const fileName = `Relatorio_Leads_Acumulado_${new Date().toISOString().slice(0,10)}.xlsx`;
            XLSX.writeFile(wb, fileName);

            const phone = "5541996509734";
            const message = encodeURIComponent(
                `Olá! Segue o relatório acumulado.\n\n` +
                `👤 *Enviado por:* ${colaborador}\n` +
                `🏢 *Unidade:* ${otica}\n` +
                `📅 *Período:* Todo histórico salvo\n` +
                `📊 *Total de Leads:* ${leads.length}\n\n` +
                `⚠️ *Anexe o arquivo Excel baixado.*`
            );

            setTimeout(() => {
                window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
            }, 1000);
        }

        function limparHistorico() {
            if (confirm("TEM CERTEZA? Isso apagará todos os leads salvos neste navegador. Faça o download do Excel antes se precisar.")) {
                leads = [];
                localStorage.removeItem('leads_ammo_db');
                atualizarTabela();
                alert("Histórico limpo com sucesso.");
            }
        }
    </script>
</body>
</html>
